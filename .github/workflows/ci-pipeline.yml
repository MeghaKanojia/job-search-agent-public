name: Pipeline CI

on:
  pull_request:
    paths: ["pipeline/**"]
  push:
    branches: [main]
    paths: ["pipeline/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r pipeline/requirements.txt
      - run: python -m pytest pipeline/tests
