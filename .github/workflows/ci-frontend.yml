name: Frontend CI

on:
  pull_request:
    paths: ["frontend/**"]
  push:
    branches: [main]
    paths: ["frontend/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # No package-lock.json is committed in this repo, so `npm ci` (which
      # requires one) fails deterministically every run, not intermittently --
      # an earlier version of this step wrongly diagnosed it as flaky and added
      # a retry loop around the same failing command, which never helped.
      # `npm install` doesn't require a lockfile; retrying it still guards
      # against genuine registry blips.
      - name: npm install (with retry)
        working-directory: frontend
        run: |
          for attempt in 1 2 3; do
            npm install && exit 0
            echo "npm install failed (attempt $attempt), retrying..."
            sleep 10
          done
          exit 1
      - run: npm run build
        working-directory: frontend
